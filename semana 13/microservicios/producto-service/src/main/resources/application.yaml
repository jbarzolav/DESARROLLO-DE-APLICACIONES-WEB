server:
  address: 127.0.0.1
  port: 8083

spring:
  application:
    name: producto-service
  datasource:
    url: jdbc:h2:mem:bd_producto
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1

