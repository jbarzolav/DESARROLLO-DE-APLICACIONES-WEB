server:
  port: 9092
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:servidor}:3306/bd_categoria
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
empresa:
  ambiente: produccion
