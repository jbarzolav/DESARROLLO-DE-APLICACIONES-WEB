<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Citas Médicas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; }
        .header { background: #dc2626; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .panel { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-weight: 600; font-size: 13px; color: #374151; }
        .form-group input, .form-group select { padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; width: 100%; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 3px rgba(220,38,38,0.1); }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .btn-primary { background: #dc2626; color: white; }
        .btn-primary:hover { background: #b91c1c; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-success { background: #16a34a; color: white; }
        .btn-success:hover { background: #15803d; }
        .btn-danger { background: #dc2626; color: white; font-size: 12px; padding: 6px 12px; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-editar { background: #f59e0b; color: white; font-size: 12px; padding: 6px 12px; }
        .btn-editar:hover { background: #d97706; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; }
        .msg-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .msg-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .title { font-size: 18px; font-weight: 700; color: #1f2937; margin-bottom: 16px; }
        hr { margin: 20px 0; border: none; border-top: 1px solid #e5e7eb; }
        .tabla-container { overflow-x: auto; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f9fafb; font-weight: 600; color: #374151; padding: 10px 8px; text-align: left; white-space: nowrap; }
        td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
        tr:hover { background: #f9fafb; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-red { background: #fef2f2; color: #991b1b; }
        .badge-gray { background: #f3f4f6; color: #374151; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
        .acciones { display: flex; gap: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Registro de Citas Médicas</h1>
        <p>RF-CIT-01: Registrar Citas | RF-CIT-05: Evitar Citas Duplicadas</p>
    </div>
    <div class="container">
        <div class="panel">
            <h2 class="title">Nueva Cita Médica</h2>
            <div id="msg-citas"></div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Paciente *</label>
                    <select id="ci-paciente"></select>
                </div>
                <div class="form-group">
                    <label>Especialidad *</label>
                    <select id="ci-especialidad"></select>
                </div>
                <div class="form-group">
                    <label>Médico *</label>
                    <select id="ci-medico"></select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Consultorio *</label>
                    <select id="ci-consultorio"></select>
                </div>
                <div class="form-group">
                    <label>Fecha *</label>
                    <input type="date" id="ci-fecha">
                </div>
                <div class="form-group">
                    <label>Hora *</label>
                    <input type="time" id="ci-hora">
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Tipo de Atención</label>
                    <select id="ci-tipo">
                        <option value="Consulta General">Consulta General</option>
                        <option value="Control">Control</option>
                        <option value="Urgencia">Urgencia</option>
                        <option value="Especialista">Especialista</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Motivo</label>
                    <input type="text" id="ci-motivo" placeholder="Motivo de la consulta">
                </div>
                <div class="form-group">
                    <label>Observaciones</label>
                    <input type="text" id="ci-observaciones" placeholder="Observaciones">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label>Estado</label>
                    <select id="ci-estado">
                        <option value="PROGRAMADA">Programada</option>
                        <option value="CONFIRMADA">Confirmada</option>
                        <option value="CANCELADA">Cancelada</option>
                        <option value="ATENDIDA">Atendida</option>
                        <option value="NO_ASISTIO">No Asistió</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="guardarCita()">Registrar Cita</button>
                        <button class="btn btn-warning" onclick="limpiarForm()">Limpiar</button>
                    </div>
                </div>
            </div>

            <input type="hidden" id="ci-id">

            <hr>

            <h3 class="title">Citas Registradas</h3>
            <div class="tabla-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Paciente</th>
                            <th>DNI</th>
                            <th>Especialidad</th>
                            <th>Médico</th>
                            <th>Consultorio</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Tipo</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-citas"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8080/api';

        function mostrarMsg(texto, tipo) {
            const div = document.getElementById('msg-citas');
            div.innerHTML = '<div class="msg msg-' + tipo + '">' + texto + '</div>';
            setTimeout(() => div.innerHTML = '', 4000);
        }

        async function api(url, method, body) {
            const config = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) config.body = JSON.stringify(body);
            const res = await fetch(API + url, config);
            const data = await res.json();
            if (!res.ok) throw { status: res.status, data };
            return data;
        }

        function estadoBadge(estado) {
            const colores = { 'PROGRAMADA': 'blue', 'CONFIRMADA': 'green', 'CANCELADA': 'red', 'ATENDIDA': 'green', 'NO_ASISTIO': 'gray' };
            return '<span class="badge badge-' + (colores[estado] || 'gray') + '">' + estado + '</span>';
        }

        function listarCitas() {
            api('/citas', 'GET').then(data => {
                const tbody = document.getElementById('tabla-citas');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="13" style="text-align:center;color:#9ca3af;padding:20px;">No hay citas registradas</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(c => '<tr>' +
                    '<td>' + c.id_cita + '</td>' +
                    '<td><strong>' + c.codigo + '</strong></td>' +
                    '<td>' + (c.paciente?.nombre || '') + ' ' + (c.paciente?.apellido || '') + '</td>' +
                    '<td>' + (c.paciente?.dni || '') + '</td>' +
                    '<td>' + (c.especialidad?.nombre || '') + '</td>' +
                    '<td>' + (c.medico?.nombre || '') + ' ' + (c.medico?.apellido || '') + '</td>' +
                    '<td>' + (c.consultorio?.codigo || '') + '</td>' +
                    '<td>' + c.fecha + '</td>' +
                    '<td>' + c.hora + '</td>' +
                    '<td>' + c.tipo_atencion + '</td>' +
                    '<td>' + c.motivo + '</td>' +
                    '<td>' + estadoBadge(c.estado) + '</td>' +
                    '<td><div class="acciones">' +
                    '<button class="btn-editar" onclick="editarCita(' + c.id_cita + ')">Editar</button>' +
                    '<button class="btn-danger" onclick="eliminarCita(' + c.id_cita + ')">Eliminar</button>' +
                    '</div></td></tr>').join('');
            });
        }

        async function cargarSelects() {
            const [pac, esp, med, con] = await Promise.all([
                api('/pacientes', 'GET'),
                api('/especialidades', 'GET'),
                api('/medicos', 'GET'),
                api('/consultorios', 'GET')
            ]);
            document.getElementById('ci-paciente').innerHTML = '<option value="">Seleccionar...</option>' + pac.map(p => '<option value="' + p.id_paciente + '">' + p.nombre + ' ' + p.apellido + ' (DNI: ' + p.dni + ')</option>').join('');
            document.getElementById('ci-especialidad').innerHTML = '<option value="">Seleccionar...</option>' + esp.map(e => '<option value="' + e.id_especialidad + '">' + e.nombre + '</option>').join('');
            document.getElementById('ci-medico').innerHTML = '<option value="">Seleccionar...</option>' + med.map(m => '<option value="' + m.id_medico + '">' + m.nombre + ' ' + m.apellido + '</option>').join('');
            document.getElementById('ci-consultorio').innerHTML = '<option value="">Seleccionar...</option>' + con.map(c => '<option value="' + c.id_consultorio + '">' + c.codigo + ' - ' + c.nombre + '</option>').join('');
        }

        function guardarCita() {
            const id = document.getElementById('ci-id').value;
            const body = {
                paciente: { id_paciente: parseInt(document.getElementById('ci-paciente').value) },
                especialidad: { id_especialidad: parseInt(document.getElementById('ci-especialidad').value) },
                medico: { id_medico: parseInt(document.getElementById('ci-medico').value) },
                consultorio: { id_consultorio: parseInt(document.getElementById('ci-consultorio').value) },
                fecha: document.getElementById('ci-fecha').value,
                hora: document.getElementById('ci-hora').value + ':00',
                tipo_atencion: document.getElementById('ci-tipo').value,
                motivo: document.getElementById('ci-motivo').value,
                observaciones: document.getElementById('ci-observaciones').value,
                estado: document.getElementById('ci-estado').value
            };
            const promesa = id ? api('/citas/' + id, 'PUT', body) : api('/citas', 'POST', body);
            promesa.then(() => {
                mostrarMsg(id ? 'Cita actualizada correctamente' : 'Cita registrada correctamente', 'success');
                limpiarForm();
                listarCitas();
            }).catch(e => mostrarMsg(e.data?.error || 'Error al guardar la cita', 'error'));
        }

        function editarCita(id) {
            api('/citas/' + id, 'GET').then(async c => {
                document.getElementById('ci-id').value = c.id_cita;
                document.getElementById('ci-fecha').value = c.fecha;
                document.getElementById('ci-hora').value = c.hora?.substring(0, 5);
                document.getElementById('ci-tipo').value = c.tipo_atencion;
                document.getElementById('ci-motivo').value = c.motivo;
                document.getElementById('ci-observaciones').value = c.observaciones;
                document.getElementById('ci-estado').value = c.estado;
                await cargarSelects();
                document.getElementById('ci-paciente').value = c.paciente?.id_paciente || '';
                document.getElementById('ci-especialidad').value = c.especialidad?.id_especialidad || '';
                document.getElementById('ci-medico').value = c.medico?.id_medico || '';
                document.getElementById('ci-consultorio').value = c.consultorio?.id_consultorio || '';
            });
        }

        function eliminarCita(id) {
            if (confirm('¿Eliminar esta cita médica?')) {
                api('/citas/' + id, 'DELETE').then(() => {
                    mostrarMsg('Cita eliminada correctamente', 'success');
                    listarCitas();
                });
            }
        }

        function limpiarForm() {
            document.getElementById('ci-id').value = '';
            document.getElementById('ci-paciente').value = '';
            document.getElementById('ci-especialidad').value = '';
            document.getElementById('ci-medico').value = '';
            document.getElementById('ci-consultorio').value = '';
            document.getElementById('ci-fecha').value = '';
            document.getElementById('ci-hora').value = '';
            document.getElementById('ci-tipo').value = 'Consulta General';
            document.getElementById('ci-motivo').value = '';
            document.getElementById('ci-observaciones').value = '';
            document.getElementById('ci-estado').value = 'PROGRAMADA';
        }

        cargarSelects();
        listarCitas();
    </script>
</body>
</html>
